<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --brand-blue: #285bab;
      --brand-blue-dark: #214d99;
      --ink: #285aa8;
      --muted: #667085;
      --line: #edf1f7;
      --panel: #ffffff;
      --soft-panel: #f7f8fa;
      --success: #21a344;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: #fbfcfe;
      color: #3f4b5d;
      font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 16px;
    }

    body[data-font-size="large"] { zoom: 1.2; }

    .app-header {
      height: 70px;
      background: linear-gradient(110deg, var(--brand-blue-dark), var(--brand-blue));
      color: #fff;
      box-shadow: 0 2px 9px rgba(24, 62, 124, .14);
    }

    .header-inner {
      width: min(1380px, calc(100% - 48px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .menu-button {
      border: 0;
      padding: 8px;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .menu-button svg { display: block; width: 27px; height: 27px; }

    .header-actions { display: flex; align-items: center; gap: 7px; }
    .header-action, .font-size-button { min-height: 34px; padding: 7px 10px; border: 1px solid rgba(255, 255, 255, .32); border-radius: 5px; background: rgba(255, 255, 255, .95); color: #214b96; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
    .header-action:hover, .font-size-button:hover { background: #e2f0fc; }
    .header-action:focus-visible, .font-size-button:focus-visible, .menu-button:focus-visible { outline: 3px solid #f9d36a; outline-offset: 2px; }
    .header-status { color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .font-size-button[aria-pressed="true"] { background: #e2f0fc; }
    .header-setting { display: flex; align-items: center; gap: 5px; color: #fff; font-size: 12px; font-weight: 700; }
    .header-setting select { min-width: 92px; padding: 7px 24px 7px 8px; border: 1px solid rgba(255, 255, 255, .4); border-radius: 6px; background: rgba(255, 255, 255, .14); color: #fff; font: inherit; cursor: pointer; }
    .header-setting select option { background: #fff; color: #35445a; }

    .main-nav {
      display: none;
      position: absolute;
      z-index: 10;
      top: 62px;
      right: 24px;
      width: 230px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 14px 35px rgba(32, 56, 94, .18);
    }

    .main-nav.is-open { display: grid; }

    .main-nav a, .main-nav span {
      padding: 11px 13px;
      color: #35445a;
      text-decoration: none;
      border-radius: 8px;
    }

    .main-nav a:hover { background: #f0f5ff; color: var(--brand-blue); }

    .page-shell {
      width: min(910px, calc(100% - 40px));
      margin: 32px auto 80px;
    }

    .dashboard-card {
      margin-bottom: 34px;
      padding: 28px 28px 30px;
      border: 1px solid #f0f3f8;
      border-radius: 17px;
      background: var(--panel);
      box-shadow: 0 6px 23px rgba(56, 76, 107, .08);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 20px;
      color: var(--ink);
      font-size: 22px;
      font-weight: 800;
    }

    .heading-label { display: flex; align-items: center; gap: 9px; }
    .heading-icon { width: 25px; height: 25px; flex: 0 0 auto; }

    .refresh-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--success);
      font-size: 15px;
      white-space: nowrap;
    }

    .refresh-icon { width: 21px; height: 21px; }
    .leaflet-container { border-radius: 11px; }

    .weather-panel {
      min-height: 149px;
      padding: 18px 19px;
      border-radius: 11px;
      background: var(--soft-panel);
    }

    .weather-panel p { margin: 0 0 11px; }
    .weather-location { font-weight: 700; color: #4d5b6b; }
    .weather-status { color: var(--success); font-weight: 800; }
    .weather-meta { color: #607084; font-size: 14px; }
    .weather-meta:last-child { margin-bottom: 0; }
    .status-icon { width: 18px; height: 18px; vertical-align: -4px; margin-right: 5px; }

    .search-panel, .shelter-result, .empty-results {
      border: 1px solid #edf1f7;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 6px 23px rgba(56, 76, 107, .08);
    }

    .search-panel { padding: 34px 38px 30px; }
    .search-title-row, .results-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .eyebrow { margin: 0 0 7px; color: #6a8bc5; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    .search-panel h1, .results-header h1 { margin: 0; color: #285aa8; font-size: 29px; }
    .search-lead, .result-count { margin: 11px 0 0; color: #69778a; }
    .search-mark, .empty-icon { color: #285aa8; font-size: 42px; font-weight: 300; line-height: 1; }
    .search-form { margin-top: 32px; }
    .search-form > label, .search-form legend { display: block; margin-bottom: 9px; color: #37475c; font-weight: 800; }
    .search-form input[type="search"] { width: 100%; padding: 14px 16px; border: 1px solid #dce3ed; border-radius: 9px; color: #3f4b5d; font: inherit; outline: none; }
    .search-form input[type="search"]:focus { border-color: #5c87ce; box-shadow: 0 0 0 3px rgba(40, 91, 171, .12); }
    .search-form fieldset { margin: 27px 0 0; padding: 0; border: 0; }
    .requirement-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .requirement-grid label { display: flex; align-items: center; gap: 8px; min-height: 49px; padding: 0 12px; border: 1px solid #e1e7ef; border-radius: 9px; color: #4a596b; cursor: pointer; }
    .requirement-grid label:has(input:checked) { border-color: #5c87ce; background: #f0f5ff; color: #285aa8; }
    .requirement-grid input { accent-color: #285aa8; }
    .search-submit { display: inline-block; margin-top: 28px; padding: 13px 24px; border: 0; border-radius: 8px; background: #285bab; color: #fff; font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
    .search-submit:hover { background: #214d99; }
    .all-shelters-link, .edit-search { display: inline-block; margin-top: 21px; color: #285aa8; font-size: 14px; font-weight: 700; text-decoration: none; }
    .result-count strong { color: #285aa8; font-size: 24px; }
    .edit-search { margin-top: 19px; padding: 10px 14px; border: 1px solid #cbd9ef; border-radius: 8px; }
    .applied-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 23px 0 15px; }
    .filter-chip, .support-tag { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #edf4ff; color: #285aa8; font-size: 13px; font-weight: 700; }
    .results-content { margin-top: 28px; }
    .results-content.has-map { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; gap: 20px; }
    .result-list { display: grid; gap: 13px; }
    .results-map-panel { position: sticky; top: 20px; padding: 18px; border: 1px solid #edf1f7; border-radius: 17px; background: #fff; box-shadow: 0 6px 23px rgba(56, 76, 107, .08); }
    .results-map-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 13px; }
    .results-map-heading h2 { margin: 0; color: #285aa8; font-size: 20px; }
    .results-map-heading span { color: #718096; font-size: 13px; }
    .results-map { height: 350px; border-radius: 11px; }
    .route-status { margin: 12px 2px 0; color: #667085; font-size: 13px; line-height: 1.6; }
    .shelter-result { display: flex; align-items: center; gap: 17px; padding: 20px 23px; }
    .result-number { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: #285bab; color: #fff; font-size: 15px; font-weight: 800; }
    .numbered-marker { border: 0; background: transparent; }
    .numbered-marker span { display: grid; place-items: center; width: 32px; height: 32px; border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #285bab; color: #fff; box-shadow: 0 2px 7px rgba(36, 67, 116, .35); font-size: 13px; font-weight: 800; }
    .numbered-marker span b { display: block; transform: rotate(45deg); font-size: 13px; }
    .shelter-result-body { min-width: 0; flex: 1; }
    .shelter-result h2 { margin: 0; color: #34445a; font-size: 19px; }
    .shelter-location { margin: 7px 0 11px; color: #768396; font-size: 14px; }
    .shelter-status { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 11px; }
    .status-badge, .capacity-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .status-混雑 { background: #ffe8e5; color: #c63e35; }
    .status-やや混雑 { background: #fff4d9; color: #a56b00; }
    .status-空き { background: #e5f7eb; color: #218744; }
    .capacity-badge { background: #f0f3f7; color: #59687a; }
    .congestion-updated { margin: 0 0 11px; color: #8a96a6; font-size: 12px; }
    .support-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .empty-results { margin-top: 28px; padding: 45px 24px; text-align: center; }
    .empty-results .empty-icon { font-size: 48px; }
    .empty-results h2 { margin: 15px 0 8px; color: #34445a; font-size: 20px; }
    .empty-results p { margin: 0; color: #748194; }

    @media (max-width: 600px) {
      .app-header { height: 62px; }
      .header-inner { width: calc(100% - 28px); }
      .brand { font-size: 21px; }
      .header-actions { gap: 3px; }
      .header-setting { gap: 2px; font-size: 10px; }
      .header-setting select { min-width: 68px; padding: 6px 16px 6px 5px; font-size: 11px; }
      .header-action, .font-size-button { min-height: 30px; padding: 5px 6px; font-size: 10px; }
      .header-status { font-size: 10px; }
      .menu-button { padding: 6px 3px 6px 5px; }
      .main-nav { top: 56px; right: 14px; }
      .page-shell { width: calc(100% - 24px); margin-top: 18px; }
      .dashboard-card { padding: 20px 14px 18px; margin-bottom: 20px; border-radius: 13px; }
      .card-heading { align-items: flex-start; font-size: 18px; }
      .refresh-label { font-size: 12px; }
      #shelterMap { height: 280px !important; }
      .search-panel { padding: 24px 17px; }
      .search-panel h1, .results-header h1 { font-size: 24px; }
      .requirement-grid { grid-template-columns: repeat(2, 1fr); }
      .requirement-grid label:last-child { grid-column: 1 / -1; }
      .shelter-result { padding: 16px 14px; gap: 11px; }
      .shelter-result h2 { font-size: 16px; }
      .results-header { align-items: flex-end; }
      .results-content.has-map { display: flex; flex-direction: column; }
      .results-map-panel { position: static; order: -1; width: 100%; }
      .results-map { height: 300px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/" data-ja="防災アプリ" data-en="Disaster App">防災アプリ</a>
      <div class="header-actions">
        {% if session.logged_in %}
          <a class="header-action" href="{{ url_for('logout') }}" data-ja="ログアウト" data-en="Log out" data-zh="登出">ログアウト</a>
          <span class="header-status" data-ja="ログイン中" data-en="Logged in" data-zh="已登录">ログイン中</span>
        {% else %}
          <span class="header-status" data-ja="未ログイン" data-en="Not logged in" data-zh="未登录">未ログイン</span>
        {% endif %}
        <button class="font-size-button" type="button" id="fontSizeButton" aria-pressed="false" data-ja="文字の大きさ" data-en="Text size" data-zh="文字大小">文字の大きさ</button>
        <label class="header-setting">
          <span data-ja="言語" data-en="Language" data-zh="语言">言語</span>
          <select id="languageSelect" aria-label="言語">
            <option value="ja" data-ja="日本語" data-en="Japanese" data-zh="日语">日本語</option>
            <option value="en" data-ja="英語" data-en="English" data-zh="英语">English</option>
            <option value="zh" data-ja="中国語" data-en="Chinese" data-zh="中文">中文</option>
          </select>
        </label>
        <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="mainNav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      <nav class="main-nav" id="mainNav">
        <a href="/" data-ja="ホーム" data-en="Home">ホーム</a>
        <a href="/shelter_search" data-ja="避難所検索" data-en="Shelter search">避難所検索</a>
        <a href="/shelter_register" data-ja="避難所登録" data-en="Register shelter">避難所登録</a>
        <a href="/board" data-ja="指示・発信ボード" data-en="Message board">指示・発信ボード</a>
        {% if session.logged_in %}
          <span data-ja="ログイン中{% if session.username %}（{{ session.username }}）{% endif %}" data-en="Logged in{% if session.username %} ({{ session.username }}){% endif %}">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
          <a href="/logout" data-ja="ログアウト" data-en="Log out">ログアウト</a>
        {% else %}
          <span data-ja="未ログイン" data-en="Not logged in" data-zh="未登录">未ログイン</span>
          <a href="/login" data-ja="ログイン" data-en="Log in">ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const mainNav = document.querySelector('#mainNav');
    const languageSelect = document.querySelector('#languageSelect');
    const fontSizeSelect = document.querySelector('#fontSizeSelect');

    function applyLanguage(language) {
      window.bousaiLanguage = language;
      document.documentElement.lang = language;
      document.querySelectorAll('[data-ja][data-en]').forEach((element) => {
        element.textContent = element.dataset[language] || element.dataset.en;
      });
      document.querySelectorAll('[data-placeholder-ja][data-placeholder-en]').forEach((element) => {
        element.placeholder = element.dataset[`placeholder${language === 'ja' ? 'Ja' : 'En'}`];
      });
      document.querySelectorAll('[data-shelter-name]').forEach((element) => {
        element.textContent = window.translateShelterName(element.dataset.shelterName);
      });
      document.querySelectorAll('[data-shelter-address]').forEach((element) => {
        element.textContent = window.translateShelterAddress(element.dataset.shelterAddress);
      });
      languageSelect.value = language;
      localStorage.setItem('bousai-language', language);
      window.dispatchEvent(new Event('languagechange'));
    }

    const shelterNameTranslations = {
      '御所見小学校': 'Goshomi Elementary School',
      '片瀬小学校': 'Katase Elementary School',
      '鵠洋小学校': 'Koyo Elementary School',
      '南町市民センター': 'Minamicho Civic Center',
      '北町コミュニティホール': 'Kitamachi Community Hall',
      '中央公民館': 'Central Community Center',
      '東町体育館': 'Higashimachi Gymnasium',
      'かきく': 'Kakiku Shelter'
    };
    window.translateShelterName = (name) => window.bousaiLanguage === 'en' ? (shelterNameTranslations[name] || name) : name;
    window.translateShelterAddress = (address) => window.bousaiLanguage === 'en' ? address.replace(/^青森市/, 'Aomori City ').replace(/中央|東町|西町|南町|北町/g, (area) => ({中央: 'Chuo', 東町: 'Higashimachi', 西町: 'Nishimachi', 南町: 'Minamicho', 北町: 'Kitamachi'})[area]) : address;

    function applyFontSize(size) {
      document.body.dataset.fontSize = size;
      const fontSizeButton = document.querySelector('#fontSizeButton');
      fontSizeButton.setAttribute('aria-pressed', size === 'large');
      localStorage.setItem('bousai-font-size', size);
    }

    applyLanguage(localStorage.getItem('bousai-language') || 'ja');
    applyFontSize(localStorage.getItem('bousai-font-size') === 'large' ? 'large' : 'normal');
    languageSelect.addEventListener('change', (event) => applyLanguage(event.target.value));
    document.querySelector('#fontSizeButton').addEventListener('click', () => {
      applyFontSize(document.body.dataset.fontSize === 'large' ? 'normal' : 'large');
    });
    menuButton.addEventListener('click', () => {
      const isOpen = mainNav.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', isOpen);
    });
  </script>
</body>
</html>
